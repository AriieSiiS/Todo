name: Integración continua

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true
      - name: Instalar dependencias
        run: flutter pub get
      - name: Análisis estático
        run: flutter analyze
      - name: Pruebas
        run: flutter test
