name: todo
description: Personal todo app for Windows, web and Android.
publish_to: none

version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  google_fonts: ^6.3.2
  http: ^1.5.0
  just_audio: ^0.10.5
  just_audio_windows: ^0.2.2
  material_design_icons_flutter: ^7.0.7296
  oauth2: ^2.0.5
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.10.3
  url_launcher: ^6.3.2
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/todo_logo.png
    - resources/Persona 5 but it's Lofi ~ Chill Lofi Mix for Study_Work (1 Hour) [aM9dxd2nRwE] (1).mp3
    - resources/task-complete.wav
