name: todo
description: Aplicación personal de tareas para Windows.
publish_to: none

version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  crypto: ^3.0.7
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^21.0.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  google_fonts: ^6.3.2
  http: ^1.5.0
  image: ^4.5.4
  just_audio: ^0.10.5
  just_audio_windows: ^0.2.2
  material_design_icons_flutter: ^7.0.7296
  oauth2: ^2.0.5
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.10.3
  timezone: ^0.11.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/todo_logo.png
    - assets/branding/todo-app-icon.svg
    - resources/Persona 5 but it's Lofi ~ Chill Lofi Mix for Study_Work (1 Hour) [aM9dxd2nRwE] (1).mp3
    - resources/task-complete.wav
    - resources/task-complete-pencil-check.mp3
